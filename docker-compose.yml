services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fx
      POSTGRES_USER: fx
      POSTGRES_PASSWORD: fx
    ports:
      - "5432:5432"
    volumes:
      - fx-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fx -d fx"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      FX_ADMIN_KEY: ${FX_ADMIN_KEY:-local-admin-key}
    ports:
      - "8080:8080"

volumes:
  fx-data:
