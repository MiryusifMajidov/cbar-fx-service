spring:
  application:
    name: cbar-fx-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fx}
    username: ${DB_USER:fx}
    password: ${DB_PASSWORD:fx}
    hikari:
      maximum-pool-size: 10
  cache:
    type: caffeine
    cache-names: currencies,daily-rates,api-clients
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=30m
  jackson:
    serialization:
      write-dates-as-timestamps: false
  mvc:
    format:
      date: iso

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

fx:
  cbar:
    base-url: https://www.cbar.az
    connect-timeout: 5s
    read-timeout: 15s
  sync:
    enabled: true
    cron: "0 5 0,10,16 * * *"
    zone: Asia/Baku
    max-backfill-days: 366
  security:
    admin-key: ${FX_ADMIN_KEY:local-admin-key}
    default-requests-per-minute: 60

logging:
  level:
    az.yusif.fx: INFO
